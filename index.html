<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Counter</title>
</head>

<body class="main container">
    <div class="main__wrapper">
        <h1 class="main__title font-bold">
            Counter
        </h1>
        <span class="main__counter font-bold" data-target="value">0</span>
        <div class="main__buttons-wrapper">
            <button data-action="decrease" class="main__button" type="button">Decrease</button>
            <button data-action="reset" class="main__button" type="button">Reset</button>
            <button data-action="increase" class="main__button" type="button">Increase</button>
        </div>
    </div>


    <script type="module" src="js/app.js"></script>
</body>

</html>
